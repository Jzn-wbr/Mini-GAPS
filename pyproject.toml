[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaps-scraper"
version = "0.1.0"
description = "Consultation personnelle des notes, absences et horaires GAPS"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.1",
    "icalendar==7.3.0",
    "python-dateutil==4.0.0",
    "tzdata==2026.6",
    "typing-extensions==4.16.0; python_version < '3.13'",
    "fastapi==0.163.2",
    "pydantic==2.14.3",
    "uvicorn==0.54.0",
    "starlette==1.10.0",
    "pywebpush==2.5.0",
    "py-vapid==1.9.6",
    "requests==2.34.2",
    "cryptography==50.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaps_scraper = ["web/*", "web/assets/*"]
